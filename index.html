<meta name="description" content="AjoShield helps Ajo, Esusu, Adashe, Chama, Stokvel and Susu groups run savings circles with clear rules and a verifiable record. Investor demo on Solana devnet.">
<style>
:root{
  --bg:#F3F6FB;--surface:#FFFFFF;--ink:#0B1B33;--muted:#58698A;--line:#E1E7F0;
  --brand:#1E6FE0;--brand-d:#1558B8;--brand-soft:#E8F1FD;
  --ok:#0B7A55;--ok-soft:#E3F6EE;--warn:#8A5A00;--warn-soft:#FFF3D6;--bad:#B42318;--bad-soft:#FDE9E7;
  --shadow:0 1px 2px rgba(11,27,51,.05),0 10px 28px rgba(11,27,51,.07);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}
a{color:var(--brand);font-weight:600}
h1,h2,h3,h4,p{margin:0}
.pad{padding:0 18px}

/* header */
.hdr{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:rgba(243,246,251,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:block;clip-path:polygon(50.1% 2.1%,97.4% 15.2%,97.4% 51.8%,87.1% 72.5%,72.0% 88.0%,50.1% 97.9%,28.0% 88.0%,12.9% 72.5%,2.6% 51.8%,2.6% 15.2%);width:30px;height:37.5px;flex:none;background-image:var(--logo);background-repeat:no-repeat;background-size:103.226px 103.226px;background-position:-36.58px -25.94px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em}

/* buttons */
.btn,button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:0 18px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;background:var(--brand);color:#fff;transition:background .15s,transform .05s}
.btn:active,button:active{transform:scale(.98)}
.btn:hover,button:hover{background:var(--brand-d)}
.btn.line,button.line{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.line:hover,button.line:hover{background:var(--brand-soft)}
button.ok{background:var(--ok)}
button.sm,.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8DB8F5;outline-offset:2px}
.stack{display:grid;gap:10px}

/* hero */
.hero{position:relative;overflow:hidden;padding:22px 18px 8px;background:linear-gradient(180deg,#E6F0FD 0%,var(--bg) 100%)}
.hero svg.curves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(svg){position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#F5A524;display:inline-block}
.hero h1{font-size:34px;line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:16px 0 12px}
.hero h1 span{color:var(--brand)}
.lead{color:var(--muted);font-size:16.5px;line-height:1.55}
.hero .stack{margin:20px 0}
.photo{position:relative;margin:6px 0 18px}
.photo::before{content:"";position:absolute;right:-24px;top:-18px;width:150px;height:150px;border-radius:50%;background:#D9C8EA;opacity:.7}
.photo img{position:relative;display:block;width:100%;height:auto;aspect-ratio:5/4;object-fit:cover;border-radius:28px;box-shadow:var(--shadow)}
.float{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;line-height:1.25}
.float small{font-size:11.5px;color:var(--muted)}.float b{font-size:20px;letter-spacing:-.02em}
.cap{font-size:11.5px;color:var(--muted);margin-top:8px}

/* sections and cards */
.sec{padding:22px 18px 0}
.sec>h2{font-size:21px;letter-spacing:-.02em;margin-bottom:4px}
.sec>.lead{margin-bottom:14px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:17px;letter-spacing:-.01em}
.card h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand-d);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.amber{background:var(--warn-soft);color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two h4{margin-top:0}
.list{list-style:none;margin:0;padding:0}
.list li{position:relative;padding:5px 0 5px 22px;font-size:14px}
.list li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.list.sim li::before{background:#F5A524}
.steps3{display:grid;gap:12px}
.step3{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:12px;background:var(--brand-soft);color:var(--brand-d);font-weight:800;display:flex;align-items:center;justify-content:center}
.step3 b{display:block;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}

/* circles */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E7ECF4;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{background:transparent;color:var(--muted);min-height:42px;box-shadow:none}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,27,51,.12)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.stat{background:var(--bg);border-radius:14px;padding:11px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{display:block;font-size:19px;letter-spacing:-.02em}.stat small{font-size:11.5px;color:var(--muted)}
.bar{height:8px;background:#E7ECF4;border-radius:99px;margin:14px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.seats{list-style:none;margin:0;padding:0}
.seats li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.seats li:last-child{border-bottom:0}
.seats .dot{display:inline-flex;align-items:center;gap:10px}
.seats .dot i{width:26px;height:26px;border-radius:50%;background:#E7ECF4;color:var(--muted);font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seats li.done .dot i{background:var(--ok-soft);color:var(--ok)}
.field{display:block;margin:12px 0 0}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input,select{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:10px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.links{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0;font-size:14px}

/* simulator */
.tl{list-style:none;margin:0;padding:0;counter-reset:s}
.tl li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:14.5px}
.tl li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tl li::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchips button{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);min-height:44px;padding:0 14px}
.rchips button.on{background:var(--brand);color:#fff;box-shadow:none}
.status{padding:14px;border-radius:14px;font-weight:800;margin:6px 0 4px;font-size:15.5px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.part{background:var(--warn-soft);color:var(--warn)}
.status.none{background:var(--bad-soft);color:var(--bad)}
.res .r{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.res .r:last-child{border-bottom:0}
.res .r b{text-align:right}
.res .r.key b{color:var(--ink)}

/* nav, toast, footer */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600;border-radius:12px}
.tabbar a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:490px;z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;box-shadow:0 10px 30px rgba(11,27,51,.3)}
.banner{display:block;margin:0 18px 8px;background:var(--brand-soft);color:var(--brand-d);padding:12px 14px;border-radius:14px;font-size:14px;text-decoration:none;font-weight:600}
.foot{padding:8px 18px 0;font-size:12.5px;color:var(--muted)}

.cstrip{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.cstrip::-webkit-scrollbar{display:none}
.cstrip>span{flex:none;font-size:12.5px;color:var(--muted);font-weight:600}
.cchip{flex:none;min-height:36px;padding:0 14px;font-size:13px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.cchip:hover{background:var(--brand-soft)}
.cchip.on{background:var(--brand);color:#fff;box-shadow:none}
.gallery:not(:has(figure)){display:none}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.shot{margin:0}
.shot img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;box-shadow:var(--shadow);background:#E7ECF4}
.shot:first-child{grid-column:1/-1}
.shot:first-child img{aspect-ratio:3/2}
.shot figcaption{font-size:13px;font-weight:600;margin-top:6px}
details.faq{border-bottom:1px solid var(--line);padding:2px 0}
details.faq:last-child{border-bottom:0}
details.faq summary{cursor:pointer;list-style:none;font-weight:700;font-size:15.5px;padding:14px 28px 14px 0;position:relative}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";position:absolute;right:4px;top:10px;font-size:22px;font-weight:500;color:var(--brand)}
details.faq[open] summary::after{content:"–"}
details.faq p{color:var(--muted);font-size:14.5px;padding:0 0 14px}
.road{list-style:none;margin:0;padding:0}
.road li{position:relative;padding:0 0 18px 28px}
.road li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);box-shadow:0 0 0 4px #fff}
.road li.now::before{background:var(--ok)}
.road li::after{content:"";position:absolute;left:5px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.road li:last-child::after{display:none}
.road b{display:block;font-size:15.5px}
.phone{display:flex;gap:8px}
.phone input{flex:1;min-width:0}

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ circles: S.circles, activity: S.activity })); } catch (e) {}
  }
  function saveCountry() { try { localStorage.setItem(KEY + ":country", String(S.country)); } catch (e) {} }

  // The two built-in demo circles follow the chosen country until they have been used.
  function applyCountryToDemoCircles() {
    var ct = COUNTRIES[S.country] || COUNTRIES[0];
    S.circles.forEach(function (c) {
      if ((c.id === "open-weekly" || c.id === "open-monthly") && c.paid.length === 0 && c.round === 1) {
        c.cur = ct.code;
        c.amount = c.id === "open-weekly" ? ct.unit : Math.round(ct.unit * 2.5);
      }
    });
  }
  applyCountryToDemoCircles();

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function country() { return COUNTRIES[S.country] || COUNTRIES[0]; }
  function symOf(code) {
    for (var i = 0; i < COUNTRIES.length; i++) if (COUNTRIES[i].code === code) return COUNTRIES[i].sym;
    return code + " ";
  }
  // money(n) uses the chosen demo country; money(n, "GHS") uses that currency.
  function money(n, code) { return symOf(code || country().code) + Math.round(n).toLocaleString("en-US"); }
  // Amounts on a circle always use that circle's own currency (older circles were created in NGN).
  function cm(c, n) { return money(n, c.cur || "NGN"); }
  function imgSrc(id, fallback) { return S.imgs[id] ? "images/" + id + ".jpg" : (fallback || ""); }
  function short(s) { return s.slice(0, 5) + "…" + s.slice(-5); }
  function solscan(type, id) { return "https://solscan.io/" + type + "/" + id + "?cluster=" + CLUSTER; }
  function getProvider() {
    if (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom) return window.phantom.solana;
    if (window.solana && window.solana.isPhantom) return window.solana;
    return null;
  }
  function phantomLink() {
    return "https://phantom.app/ul/browse/" + encodeURIComponent(location.href) + "?ref=" + encodeURIComponent(location.origin);
  }
  function pageFromHash() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    return PAGES.indexOf(h) > -1 ? h : "home";
  }

  /* ---------- real on-chain recording (Solana devnet memos) ---------- */
  async function sendMemos(texts) {
    await ensureLib();
    var p = getProvider();
    if (!p || !S.pubkey) throw new Error("Connect your wallet first.");
    if (typeof p.signTransaction !== "function") throw new Error("This wallet cannot sign transactions. Please use Phantom.");
    var pk = new W.PublicKey(S.pubkey);
    // Fees are tiny, but the wallet needs some devnet SOL. Check on devnet before opening the wallet.
    var bal = await connection.getBalance(pk);
    if (bal < 20000) throw new Error("insufficient devnet SOL");
    var memoProgram = new W.PublicKey(MEMO_ID);
    var tx = new W.Transaction();
    texts.forEach(function (text) {
      tx.add(new W.TransactionInstruction({
        keys: [{ pubkey: pk, isSigner: true, isWritable: false }],
        programId: memoProgram,
        data: new TextEncoder().encode(text)
      }));
    });
    var latest = await connection.getLatestBlockhash();
    tx.recentBlockhash = latest.blockhash;
    tx.feePayer = pk;
    // Check on devnet that the transaction will succeed, so the wallet never has to sign one that fails.
    var sim = await connection.simulateTransaction(tx);
    if (sim && sim.value && sim.value.err) throw new Error("The test transaction would fail on devnet. Please try again in a moment.");
    // The wallet only signs. We send it ourselves to devnet, so it can never be sent to mainnet by mistake.
    var signed = await p.signTransaction(tx);
    var signature = await connection.sendRawTransaction(signed.serialize(), { maxRetries: 3 });
    await connection.confirmTransaction({ signature: signature, blockhash: latest.blockhash, lastValidBlockHeight: latest.lastValidBlockHeight }, "confirmed");
    return signature;
  }
  function sendMemo(text) { return sendMemos([text]); }

  async function refreshBalance() {
    if (!S.pubkey) { S.balance = null; return; }
    try { await ensureLib(); S.balance = (await connection.getBalance(new W.PublicKey(S.pubkey))) / W.LAMPORTS_PER_SOL; }
    catch (e) { S.balance = null; }
  }

  async function run(label, fn) {
    if (S.busy) return;
    S.busy = true; S.msg = label + "… approve in your wallet."; render();
    try { await fn(); await refreshBalance(); }
    catch (e) {
      var m = (e && e.message) ? e.message : "Something went wrong.";
      S.msg = /insufficient|0x1|debit an account/i.test(m) ? "Not enough devnet SOL for fees. Open Activity and tap “Get devnet SOL”." :
              /reject|denied|cancel/i.test(m) ? "Cancelled in wallet." : m;
    }
    S.busy = false; save(); render();
  }

  function addActivity(label, sig) {
    S.activity.unshift({ sig: sig, label: label, ts: Date.now() });

  /* ---------- default simulation (simulated figures only) ---------- */
  function simReserves() { var u = country().unit; return SIM.mults.map(function (m) { return Math.round(m * u); }); }
  function simCalc(reserve) {
    var u = country().unit, shortfall = SIM.owed * u;
    var covered = Math.min(reserve, shortfall);
    return { payout: SIM.members * u, shortfall: shortfall, reserve: reserve, covered: covered, uncovered: shortfall - covered, remaining: reserve - covered };
  }

      var c = byId(id);

        var start = c.paid.length;
        if (start >= c.size) throw new Error("Everyone has paid. Release the payout.");
        var texts = [];
        for (var seat = start + 1; seat <= c.size; seat++) {
          texts.push("AJO|v1|contribute|" + c.id + "|round" + c.round + "|seat" + seat + "|" + (c.cur || "NGN") + c.amount);
        }
        var sig = await sendMemos(texts);

          c.paid.push({ sig: sig, label: c.name + ": seat " + n + " paid", ts: Date.now() });
        }

    }).join("");
    var h = '<section class="card"><div class="row"><h3>Simulate a member default</h3><span class="pill amber">Simulated</span></div>' +
      '<p class="muted small" style="margin-top:6px">A circle of ' + SIM.members + " members, each paying " + money(c) + " every week. The weekly payout is " + money(r.payout) +
      ". The first member collects it, then stops paying the " + SIM.owed + " weeks they still owe (" + money(r.shortfall) + ").</p>" +
      "<h4>1. Choose the simulated protection reserve</h4>" + '<div class="rchips">' + chips + "</div>" +
      '<h4>2. Run the example</h4><div class="stack"><button data-act="simstart">Simulate Member Default</button><button class="line" data-act="simreset">Reset Simulation</button></div>' +
      '<div aria-live="polite">';
    if (sim.step > 0) {
      var steps = [
        "Missed payment: the first member has already collected " + money(r.payout) + ", then stops paying. They still owe " + SIM.owed + " contributions of " + money(c) + ".",
        "Flagged: AjoShield marks the payment as missed and the member as in default (simulated).",
        "Reserve check: the demo looks at the simulated protection reserve, " + money(r.reserve) + ".",
        "Cover: the reserve pays only up to the amount available. It covers " + money(r.covered) + " of the " + money(r.shortfall) + " shortfall.",
        "Result: " + (r.uncovered === 0 ? "nothing is left uncovered in this simulation." : money(r.uncovered) + " is left uncovered in this simulation.")
      ];
      h += "<h4>What happens, step by step</h4><ol class=\"tl\">";
      for (var i = 0; i < sim.step; i++) h += "<li>" + steps[i] + "</li>";
      h += "</ol>";
    }
    if (sim.step >= 5) {
      var cls = r.reserve === 0 ? "none" : (r.uncovered === 0 ? "ok" : "part");
      var msg = r.reserve === 0 ? "No reserve available in this simulation" : (r.uncovered === 0 ? "Fully covered in this simulation" : "Partially covered in this simulation");
      var rows = [
        ["Member’s missed contributions", SIM.owed + " × " + money(c) + " = " + money(r.shortfall), ""],
        ["Total eligible shortfall", money(r.shortfall), ""],
        ["Simulated reserve before the incident", money(r.reserve), ""],
        ["Covered by the simulated reserve", money(r.covered), ""],
        ["Uncovered shortfall", money(r.uncovered), " key"],
        ["Simulated reserve remaining", money(r.remaining), ""]
      ];
      h += '<div class="status ' + cls + '" id="simstatus">' + msg + "</div>" +
        '<div class="res">' + rows.map(function (x) { return '<div class="r' + x[2] + '"><span>' + x[0] + "</span><b>" + x[1] + "</b></div>"; }).join("") + "</div>" +
        '<p class="muted small" style="margin-top:8px">The uncovered shortfall is the money the other members would be missing.</p>';
    }
    h += "</div>" +
      '<p class="muted small" style="margin-top:14px">All figures on this card are simulated demo data and illustrative calculations only. They do not show that AjoShield has a funded reserve today. A smart contract cannot recover money that has already been paid to a member who disappears. No wallet is used, no money moves, and no insurance, collateral or guarantee is active in this demo.</p></section>';
    return h;
  }

  function pageProtection() {
    return '<div class="sec"><h2>Protection simulator</h2><p class="lead">Test how a protection reserve would respond when a member stops contributing.</p>' +
      simulatorHtml() +
      '<section class="card"><h3>How protection is designed to work</h3><p class="muted small" style="margin:6px 0 4px">These layers are planned. None of them is active in this demo.</p>' +
      '<div class="steps3" style="margin-top:12px">' +
      '<div class="step3"><span class="num">1</span><div><b>Verified collateral <span class="pill amber">Planned</span></b><span class="muted small">A member who collects early can lock cover for the contributions they still owe.</span></div></div>' +
      '<div class="step3"><span class="num">2</span><div><b>Funded reserve <span class="pill amber">Planned</span></b><span class="muted small">A ring-fenced balance that covers missed payments only up to the amount actually available.</span></div></div>' +
      '<div class="step3"><span class="num">3</span><div><b>Third-party guarantee <span class="pill amber">Planned</span></b><span class="muted small">An enforceable guarantee from a licensed partner, with clear limits.</span></div></div></div></section>' +
      '<section class="card"><h3>What happens if a member stops paying?</h3><p class="muted small" style="margin-top:6px">AjoShield tracks missed contributions and follows the circle’s agreed protection rules. Eligible protection is applied according to the funds and guarantees actually available. Limits and conditions are explained before members join. No guarantee is advertised unless it is funded and enforceable.</p></section></div>';
  }

  function pageActivity(connected) {
    var h = '<div class="sec"><h2>Activity and verification</h2><p class="lead">Every action in this demo is a real Solana ' + CLUSTER + " transaction that you can open on Solscan.</p>" + walletBar(connected) +
      '<section class="card"><h3>Verify it’s real</h3><p class="muted small" style="margin-top:6px">Devnet is a public test network. Amounts are simulated and no real money is used.</p><div class="links">' +
      '<a href="' + REPO_URL + '" target="_blank" rel="noopener noreferrer">Source code</a>' +
      '<a href="' + solscan("account", MEMO_ID) + '" target="_blank" rel="noopener noreferrer">Memo program</a>' +
      (connected ? '<a href="' + solscan("account", S.pubkey) + '" target="_blank" rel="noopener noreferrer">My wallet ' + short(S.pubkey) + "</a>" : "") + "</div>" +
      (connected ? '<div class="row"><span class="muted small">Devnet balance: ' + (S.balance === null ? "…" : S.balance.toFixed(3) + " SOL") +
        '</span><button class="line sm" data-act="airdrop"' + (S.busy ? " disabled" : "") + ">Get devnet SOL</button></div>" : '<p class="muted small">Connect a wallet to see your devnet balance.</p>') + "</section>" +
      '<section class="card"><h3>On-chain activity</h3>';
    if (!S.activity.length) h += '<p class="muted small" style="margin-top:6px">Nothing yet. Contribute to a circle and your transactions appear here.</p>';
    else h += '<ul class="log" style="margin-top:8px">' + S.activity.map(function (a) {
      return "<li><span>" + esc(a.label) + '</span><a href="' + solscan("tx", a.sig) + '" target="_blank" rel="noopener noreferrer">Solscan ↗</a></li>';
    }).join("") + "</ul>";
    return h + "</section></div>";
  }

  function pageStart() {
    var su = S.signup, ct = country(), h;
    var err = su.err ? '<p class="err" role="alert">' + esc(su.err) + "</p>" : "";
    if (S.user) {
      return '<div class="sec"><h2>Your account</h2><p class="lead">You are registered in the demo.</p>' +
        '<section class="card"><div class="row"><h3>' + esc(S.user.name || "Demo member") + '</h3><span class="pill amber">Demo account</span></div>' +
        '<div class="res" style="margin-top:8px"><div class="r"><span>Phone number</span><b>' + esc(maskPhone(S.user)) + '</b></div><div class="r"><span>Country</span><b>' + esc(S.user.country) + "</b></div></div>" +
        '<p class="muted small" style="margin-top:10px">Demo only: no SMS was sent. Your details are saved in this browser only, not on a server.</p>' +
        '<div class="stack" style="margin-top:14px"><a class="btn" href="#/circles">Go to my circles</a><button class="line" data-act="signout">Sign out</button></div></section></div>';
    }
    if (su.step === 2) {
      h = '<div class="sec"><h2>Enter your code</h2><p class="lead">We would send a 4-digit code by SMS to ' + esc(ct.cc + " " + su.phone) + ".</p>" +
        '<section class="card"><div class="demo-note">Demo mode: no SMS is sent. Enter any 4 digits.</div>' +
        '<label class="field"><span>Code</span><input id="su-code" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="1234"></label>' + err +
        '<div class="stack" style="margin-top:14px"><button data-act="suconfirm">Confirm</button><button class="line" data-act="suresend">' + (su.resent ? "Code sent again (demo)" : "Didn’t get a code? Send it again") + '</button><button class="line" data-act="suback">Change number</button></div>' +
        '<p class="muted small" style="margin-top:12px">Codes can take a minute to arrive. Check that your phone has signal.</p></section></div>';
      return h;
    }
    if (su.step === 3) {
      return '<div class="sec"><h2>Almost done</h2><p class="lead">Tell us what to call you. This is optional.</p>' +
        '<section class="card"><label class="field"><span>Your name (optional)</span><input id="su-name" autocomplete="name" maxlength="40" placeholder="e.g. Amina"></label>' +
        '<div class="stack" style="margin-top:14px"><button data-act="sufinish">Finish</button></div></section></div>';
    }
    return '<div class="sec"><h2>Get started</h2><p class="lead">Create your account with your mobile phone number. It takes less than a minute.</p>' +
      '<section class="card"><h3>Create your account</h3><div class="demo-note">Demo mode: no SMS is sent and nothing is stored on a server. Enter any number to try the flow.</div>' +
      '<label class="field"><span>Your mobile phone number</span><div class="phone"><span class="cc">' + esc(ct.cc) + '</span><input id="su-phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="e.g. ' + esc(ct.ph) + '" value="' + esc(su.phone) + '"></div></label>' + err +
      '<p class="muted small" style="margin-top:8px">We would send a code by SMS to confirm it is you. The country code follows the demo country selected above.</p>' +
      '<div class="stack" style="margin-top:14px"><button data-act="susend">Send code</button></div>' +
      '<a class="skip" href="#/circles">Skip sign-up and explore the demo</a></section></div>';
  }

  function faq(q, a) { return '<details class="faq"><summary>' + esc(q) + "</summary><p>" + esc(a) + "</p></details>"; }

  function pageLearn() {
    var h = '<div class="sec"><h2>About AjoShield</h2><p class="lead">AjoShield is a product of JNectar. It helps rotating savings groups run with clear rules and a verifiable record.</p>' +
      '<section class="card"><h3>Roadmap</h3><p class="muted small" style="margin:6px 0 14px">Only the first stage exists today.</p><ol class="road">' +
      '<li class="now"><b>Now: investor demo <span class="pill">Live demo</span></b><span class="muted small">Savings circles recorded on Solana devnet, public links to verify them, and the member-default simulator.</span></li>' +
      '<li><b>Next: protection rules <span class="pill amber">Planned</span></b><span class="muted small">A rules engine that checks cover before any payout, identity checks through licensed providers, and local payment partners.</span></li>' +
      '<li><b>Then: audited escrow and a pilot <span class="pill amber">Planned</span></b><span class="muted small">An audited smart contract holding funds under the circle’s rules, tested with a small number of partner groups.</span></li>' +
      '<li><b>Later: licensed rails and more markets <span class="pill amber">Planned</span></b><span class="muted small">Licensed payment rails and expansion to more countries, as approvals allow.</span></li>' +
      "</ol></section>" +
      '<section class="card"><h3>Frequently asked questions</h3><div style="margin-top:6px">' +
      faq("Is AjoShield a real financial service?", "Not yet. This is an investor demo. It holds no money, takes no deposits and pays nothing out. All amounts are simulated.") +
      faq("Is my money safe?", "The demo holds no money, so there is nothing to lose here. In the product, protection will work through verified collateral, a funded reserve or an enforceable guarantee, each with clear limits. None of these is active in this demo, and we will not promise more than is funded.") +
      faq("What happens if a member stops paying?", "AjoShield tracks missed contributions and follows the circle’s agreed protection rules. Eligible protection is applied according to the funds and guarantees actually available. You can test an example on the Protection page.") +
      faq("Which countries and currencies?", "The demo shows Nigeria, Ghana, Kenya and South Africa to illustrate a multi-country product. A market opens only when its payment and legal approvals are ready.") +
      faq("Do members need to understand crypto?", "That is the goal: members should only deal with their phone and their local currency, while the blockchain keeps the record in the background. In this demo you connect a test wallet so you can see the records.") +
      faq("Is AjoShield licensed?", "No. AjoShield is not a licensed financial service. Before handling real money, we plan to work with licensed partners and obtain the approvals required in each country.") +
      faq("What does this demo store?", "Signing up in the demo saves your phone number and name in your browser only. No SMS is sent and nothing goes to a server. Circles and activity are also saved in your browser. Transactions you send are public on Solana devnet, a test network.") +
      "</div></section>";
    if (CONTACT_EMAIL) {
      h += '<section class="card"><h3>Investor enquiries</h3><p class="muted small" style="margin:6px 0 14px">Talk to the team about the product and the roadmap.</p><a class="btn" href="mailto:' + esc(CONTACT_EMAIL) + '?subject=AjoShield%20investor%20enquiry">Email the team</a></section>';
    }
    return h + "</div>";
  }

  function render() {
    // keep typed form values across re-renders
    ["fname", "ftrad", "famount", "fsize", "ffreq", "acct", "bank"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && !(S.skipKeep && (id === "famount" || id === "bank" || id === "acct"))) S.keep[id] = el.value;
    });
    S.skipKeep = false;
    var connected = !!S.pubkey, hasWallet = !!getProvider();
    var body = S.page === "circles" ? pageCircles(connected) : S.page === "protection" ? pageProtection() : S.page === "activity" ? pageActivity(connected) : S.page === "learn" ? pageLearn() : S.page === "start" ? pageStart() : pageHome();

    var h = headerHtml();
    h += countryStrip() + body +
      '<p class="foot">AjoShield is an investor demo on Solana ' + CLUSTER + ". No real funds are held or moved, and nothing here is financial advice, insurance or a guarantee. The escrow smart contract and bank rails are on the roadmap and will be audited before handling real funds. Demo markets are shown for illustration: a market opens only when its payment and legal approvals are ready.</p>" +
      '<p class="foot" style="padding-top:6px">AjoShield · a JNectar product · © 2026</p>' +
      tabbarHtml();
    if (S.msg) h += '<div class="toast" role="status" data-act="dismiss">' + esc(S.msg) + "</div>";

    app.innerHTML = h;
    var acctEl = document.getElementById("acct");
    if (acctEl) acctEl.addEventListener("input", function () { acctEl.value = acctEl.value.replace(/\D/g, ""); });
  }

  S.page = pageFromHash();
  render();
  IMG_IDS.forEach(function (id) {
    var im = new Image();
    im.onload = function () { S.imgs[id] = true; render(); };
    im.src = "images/" + id + ".jpg";
  });
  ensureLib().catch(function () {});
  // reconnect silently if the wallet already trusts this site
  var p0 = getProvider();
  if (p0) {
    p0.connect({ onlyIfTrusted: true }).then(function (r) {
      S.pubkey = r.publicKey.toString();
      return refreshBalance();
    }).then(render).catch(function () {});
  }
})();
</script>
</body>
</html>
