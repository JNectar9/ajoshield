<meta name="description" content="Ajo, Esusu, Adashe, Chama, Stokvel and Susu savings circles on Solana. Transparent rules everyone can check.">
<style>
:root{--bg:#020f1b;--card:#06192a;--line:#0f3042;--text:#f4f8ff;--muted:#7f9bb0;--green:#04eca2;--gold:#7dffd0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.logo{font-weight:800;font-size:18px}
.hero h1{font-size:28px;line-height:1.15;margin:16px 0 8px}
.hero em{color:var(--gold);font-style:normal}
.hero p{color:var(--muted);margin:0 0 16px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h2,.card h3{margin:0 0 4px}
.card h4{margin:16px 0 8px;font-size:14px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{background:#073a2b;color:var(--green);font-size:12px;padding:4px 10px;border-radius:999px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats div{background:#04121f;border-radius:12px;padding:10px;display:flex;flex-direction:column}
.stats span{font-size:12px;color:var(--muted)}.stats b{font-size:18px}.stats small{font-size:11px;color:var(--muted)}
.seats,.log{list-style:none;margin:0;padding:0}
.seats li,.log li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.seats li.done span:first-child{color:var(--green)}
a{color:var(--gold)}
.links{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;font-size:14px}
.banner{display:block;background:#06251f;border:1px solid var(--gold);color:var(--gold);padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;text-decoration:none}
.toast{background:#063226;border:1px solid var(--green);padding:12px;border-radius:12px;margin:12px 0;font-size:14px}
.tabs{display:flex;gap:8px;margin:16px 0 4px}
.tab{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted)}
.tab.on{background:var(--green);color:#02140f;border-color:var(--green)}
input,select{width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:#04121f;color:var(--text);font-size:16px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:8px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--green);color:#02140f;cursor:pointer}
button.gold{background:var(--gold);color:#02140f}
button.ghost{background:transparent;border:1px solid var(--green);color:var(--green)}
button:disabled{opacity:.4;cursor:not-allowed}
.actions{display:grid;gap:8px;margin-top:12px}
footer{margin-top:24px;line-height:1.5}
